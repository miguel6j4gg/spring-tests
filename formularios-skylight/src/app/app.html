<header class="topbar">
  <a routerLink="/inicio" class="brand" (click)="closeMenu()">
    <span class="brand-icon">⚡</span>
    <span>
      <strong>SKYLIGHT</strong>
      <small>GENERADORES</small>
    </span>
  </a>

  <button
    type="button"
    class="menu-toggle"
    [class.open]="menuOpen"
    [attr.aria-expanded]="menuOpen"
    aria-label="Abrir menú"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="navigation" [class.open]="menuOpen">
    <a routerLink="/inicio" routerLinkActive="active"
       [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Inicio</a>

    <a routerLink="/cotizacion" routerLinkActive="active" (click)="closeMenu()">Venta</a>

    <a routerLink="/alquiler" routerLinkActive="active" (click)="closeMenu()">Alquiler</a>

    <a routerLink="/mantenimiento" routerLinkActive="active" (click)="closeMenu()">Mantenimiento</a>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>© 2026 Skylight Generadores E.I.R.L. | Soluciones energéticas</p>
</footer>
